<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membaca… — Yomu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="reader-body">

<div class="reader-progress" id="reader-progress" style="width:0%"></div>

<header class="reader-bar" id="reader-bar">
    <a class="reader-bar__back" id="reader-back" href="/" aria-label="Kembali ke halaman manga">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="reader-bar__info">
        <div class="reader-bar__manga" id="reader-manga-title">Memuat…</div>
        <div class="reader-bar__chapter" id="reader-chapter-title"></div>
    </div>
    <span class="reader-bar__page-count" id="reader-page-count"></span>
</header>

<main id="reader-main">
    <div class="reader-pages" id="reader-pages">
        <div class="skeleton" style="width:100%;height:60vh;border-radius:0;"></div>
    </div>
    <div class="reader-nav" id="reader-nav"></div>
</main>

<button class="reader-fab" id="scroll-top-fab" aria-label="Kembali ke atas" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/read.js"></script>
</body>
</html>
